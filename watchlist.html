<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Watchlist • AnumBrix</title>
<style>
:root{--bg:#0b0612;--panel:#160c24;--panel2:#211036;--border:#392052;--purple:#8b3dff;--purple2:#b05cff;--text:#fff;--muted:#bcaecc;--danger:#ff6b8a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#24103c 0,#0b0612 42%,#06030a 100%);color:var(--text)}
body{overflow-x:hidden}.ab-stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.ab-star{position:absolute;width:var(--size);height:var(--size);border-radius:50%;background:#fff;opacity:var(--opacity);animation:fall var(--duration) linear var(--delay) infinite}.ab-star.streak{width:var(--length);height:2px;border-radius:2px;transform:rotate(35deg);filter:blur(.2px)}@keyframes fall{0%{transform:translate3d(0,-15vh,0) rotate(0)}100%{transform:translate3d(-45vw,125vh,0) rotate(360deg)}}
header{position:sticky;top:0;z-index:10;background:rgba(10,5,17,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}.top{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:14px}.brand{font-weight:900;font-size:23px;background:linear-gradient(90deg,#fff,#c084fc,#8b3dff);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{font-size:12px;color:var(--muted)}.spacer{flex:1}.home{color:#fff;text-decoration:none;border:1px solid var(--border);background:#190d28;padding:9px 13px;border-radius:10px}.menu{display:none}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:32px 18px 70px}.hero{padding:22px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgba(37,16,62,.94),rgba(15,7,25,.96));box-shadow:0 20px 70px rgba(0,0,0,.3)}h1{margin:0 0 7px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.tab{border:1px solid var(--border);background:#160b23;color:#ddd0e8;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:700}.tab.active,.tab:hover{background:linear-gradient(135deg,#7625e7,#a855f7);color:#fff;border-color:#a855f7}.count{opacity:.75}
.status{display:none}.status.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}.card{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:15px;background:linear-gradient(145deg,rgba(32,15,50,.95),rgba(13,7,21,.98));transition:.2s}.card:hover{transform:translateY(-4px);border-color:#8b3dff;box-shadow:0 12px 35px rgba(139,61,255,.2)}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#20102e}.info{padding:11px}.title{font-weight:800;line-height:1.3;min-height:42px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:7px;margin-top:10px}.open{flex:1;text-align:center;text-decoration:none;color:#fff;background:linear-gradient(135deg,#7c2ce8,#a855f7);border-radius:9px;padding:8px;font-size:12px;font-weight:800}.remove{border:1px solid #573047;background:#1c0d19;color:#ffb0c2;border-radius:9px;padding:8px;cursor:pointer}.empty{padding:38px 18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px}.empty strong{display:block;color:#fff;font-size:19px;margin-bottom:6px}.loading{text-align:center;color:var(--muted);padding:35px}.notice{margin-top:15px;padding:12px 14px;border-radius:12px;border:1px solid #49315d;background:#160c23;color:#cdbdde;font-size:13px}.ok{color:#b9ffd0}.warn{color:#ffd2df}
@media(max-width:650px){.sub{display:none}.home{padding:8px 10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.top{padding:12px}.hero{padding:18px}main{padding:22px 12px 55px}}
</style>
</head>
<body>
<div class="ab-stars" aria-hidden="true"></div>
<header><div class="top"><div><div class="brand">AnumBrix</div><div class="sub">Anime discovery • tracking • community</div></div><div class="spacer"></div><a class="home" href="index.html">🏠 Home</a></div></header>
<main>
<section class="hero"><h1>❤️ My Watchlist</h1><p>Your anime tracking is now connected to your AnumBrix account.</p><div id="notice" class="notice">Checking your account…</div></section>
<nav class="tabs" id="tabs">
<button class="tab active" data-status="all">All <span class="count" id="count-all">0</span></button>
<button class="tab" data-status="currently_watching">📺 Watching <span class="count" id="count-currently_watching">0</span></button>
<button class="tab" data-status="completed">✅ Completed <span class="count" id="count-completed">0</span></button>
<button class="tab" data-status="on_hold">⏸️ On Hold <span class="count" id="count-on_hold">0</span></button>
<button class="tab" data-status="dropped">❌ Dropped <span class="count" id="count-dropped">0</span></button>
<button class="tab" data-status="plan_to_watch">📋 Plan to Watch <span class="count" id="count-plan_to_watch">0</span></button>
<button class="tab" data-status="favorites">❤️ Favorites <span class="count" id="count-favorites">0</span></button>
</nav>
<section id="content" class="status active"><div class="loading">Loading your anime…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-ui.js"></script>
<script>
(function(){
'use strict';
const TRACK='anime_tracking',EP='anime_episode_progress';
const sb=()=>window.anumBrixSupabase||null;
const content=document.getElementById('content'),notice=document.getElementById('notice');
let rows=[],active='all';
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
async function session(){const c=sb();if(!c)return null;const r=await c.auth.getSession();return r.data&&r.data.session?r.data.session:null}
function legacy(){try{return JSON.parse(localStorage.getItem('anumbrix_watchlist')||'[]')}catch(e){return[]}}
async function load(){
 const s=await session();
 if(!s){notice.innerHTML='🔐 <span class="warn">Please log in to see your account-based anime tracking.</span><br><small>Your old browser watchlist is still untouched.</small>';rows=legacy().map(x=>({id:x.id,anime_id:x.id,anime_title:x.title,anime_image:x.image,current_episode:0,status:'plan_to_watch',is_favorite:false,total_episodes:null,legacy:true}));render();return}
 const c=sb();const r=await c.from(TRACK).select('*').eq('user_id',s.user.id).order('updated_at',{ascending:false});
 if(r.error){notice.innerHTML='<span class="warn">Could not load your account watchlist: '+esc(r.error.message)+'</span>';return}
 rows=r.data||[];notice.innerHTML='<span class="ok">✓ Synced with your AnumBrix account.</span>';
 render();
}
function render(){
 const filtered=rows.filter(x=>active==='all'?true:active==='favorites'?x.is_favorite===true:x.status===active);
 ['all','currently_watching','completed','on_hold','dropped','plan_to_watch','favorites'].forEach(k=>{const n=k==='all'?rows.length:k==='favorites'?rows.filter(x=>x.is_favorite).length:rows.filter(x=>x.status===k).length;document.getElementById('count-'+k).textContent=n});
 if(!filtered.length){content.innerHTML='<div class="empty"><strong>Nothing here yet</strong>Open an anime, choose a tracking status, and it will appear here.</div>';return}
 content.innerHTML='<div class="grid">'+filtered.map(card).join('')+'</div>';
 content.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>removeItem(Number(b.dataset.remove))));
}
function card(x){const id=Number(x.anime_id||x.id);const title=esc(x.anime_title||x.title||'Unknown Anime');const image=esc(x.anime_image||x.image||'');const ep=Number(x.current_episode||0);const total=x.total_episodes?Number(x.total_episodes):null;let status=x.status||'plan_to_watch';let label={currently_watching:'📺 Watching',completed:'✅ Completed',on_hold:'⏸️ On Hold',dropped:'❌ Dropped',plan_to_watch:'📋 Plan to Watch'}[status]||'📋 Plan to Watch';return '<article class="card"><img class="poster" src="'+image+'" alt="'+title+'" loading="lazy" onerror="this.style.opacity=.35"><div class="info"><div class="title">'+title+'</div><div class="meta">'+label+(ep?' • Episode '+ep+(total?' / '+total:''):'')+(x.is_favorite?' • ❤️':'')+'</div><div class="actions"><a class="open" href="anime.html?id='+id+'">Open Anime</a><button class="remove" data-remove="'+id+'" title="Remove">✕</button></div></div></article>'}
async function removeItem(id){const s=await session();if(!s){let a=legacy().filter(x=>Number(x.id)!==id);localStorage.setItem('anumbrix_watchlist',JSON.stringify(a));rows=rows.filter(x=>Number(x.anime_id||x.id)!==id);render();return}const c=sb();const r=await c.from(TRACK).delete().eq('user_id',s.user.id).eq('anime_id',id);if(r.error){notice.innerHTML='<span class="warn">'+esc(r.error.message)+'</span>';return}rows=rows.filter(x=>Number(x.anime_id)!==id);render()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.status;render()}));
(function stars(){const layer=document.querySelector('.ab-stars');for(let i=0;i<(innerWidth<700?38:62);i++){const s=document.createElement('span');s.className='ab-star';s.style.left=(Math.random()*115-10)+'vw';s.style.top=(Math.random()*115-10)+'vh';s.style.setProperty('--size',(Math.random()*2.2+1)+'px');s.style.setProperty('--opacity',(Math.random()*.55+.25).toFixed(2));s.style.setProperty('--duration',(Math.random()*12+16).toFixed(1)+'s');s.style.setProperty('--delay',(-Math.random()*22).toFixed(1)+'s');layer.appendChild(s)}})();
load();
})();
</script>
</body>
</html>
