<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Details — ANUMBRIX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: #11111a;
            border-bottom: 1px solid #242432;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #aaaabd;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        .anime {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 30px;
        }

        .poster {
            width: 100%;
            border-radius: 14px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .description {
            color: #aaaabd;
            line-height: 1.7;
            margin: 20px 0;
        }

        .info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .tag {
            background: #1b1b27;
            border: 1px solid #303040;
            padding: 8px 12px;
            border-radius: 8px;
            color: #ddd;
        }

        .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .genre {
            background: #7c4dff;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 13px;
        }

        .watchlist {
            margin-top: 25px;
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #7c4dff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .watchlist:hover {
            opacity: 0.9;
        }

        .loading {
            color: #aaaabd;
        }

        @media (max-width: 700px) {
            .anime {
                grid-template-columns: 1fr;
            }

            .poster {
                max-width: 250px;
            }

            h1 {
                font-size: 28px;
            }
        }
        .episodes-section {
    margin-top: 30px;
}

.episodes-section h2 {
    margin-bottom: 15px;
}

.episodes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.episode {
    padding: 14px;
    background: #171722;
    border: 1px solid #292938;
    border-radius: 8px;
}

@media (min-width: 700px) {
    .episodes {
        grid-template-columns: repeat(4, 1fr);
    }
}
    </style>
<style>

/* =========================================================
   ANUMBRIX PURPLE COSMIC THEME
   Shared visual layer — keeps the existing site functionality.
   ========================================================= */

:root {
    --ab-bg: #05030b;
    --ab-bg-2: #0b0615;
    --ab-panel: rgba(16, 8, 29, 0.88);
    --ab-panel-2: rgba(25, 11, 43, 0.92);
    --ab-purple: #9b4dff;
    --ab-purple-2: #6d28d9;
    --ab-purple-3: #c084fc;
    --ab-lavender: #eadcff;
    --ab-text: #ffffff;
    --ab-muted: #b9a9d1;
    --ab-border: rgba(166, 91, 255, 0.28);
    --ab-glow: rgba(155, 77, 255, 0.48);
}

html {
    background: var(--ab-bg);
    scroll-behavior: smooth;
}

body {
    position: relative;
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 85% 10%, rgba(133, 47, 255, .18), transparent 28%),
        radial-gradient(circle at 15% 80%, rgba(94, 29, 176, .12), transparent 30%),
        linear-gradient(145deg, #030208 0%, #080412 48%, #0b0615 100%) !important;
    color: var(--ab-text) !important;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
        radial-gradient(circle at 50% 35%, rgba(172, 86, 255, .055), transparent 42%),
        linear-gradient(115deg, transparent 0%, rgba(146, 65, 255, .035) 48%, transparent 70%);
    animation: abAmbient 10s ease-in-out infinite alternate;
}

@keyframes abAmbient {
    from { opacity: .65; transform: scale(1); }
    to { opacity: 1; transform: scale(1.035); }
}

/* Star layer */
.ab-stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
}

.ab-star {
    position: absolute;
    width: var(--size, 2px);
    height: var(--size, 2px);
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 7px 1px rgba(203, 156, 255, .9);
    opacity: var(--opacity, .65);
    animation: abFall var(--duration, 18s) linear infinite;
    animation-delay: var(--delay, 0s);
}

.ab-star.streak {
    width: var(--length, 55px);
    height: 1px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, rgba(222, 191, 255, .95), transparent);
    box-shadow: 0 0 10px rgba(176, 92, 255, .75);
    transform: rotate(35deg);
}

@keyframes abFall {
    0% {
        transform: translate3d(12vw, -12vh, 0) rotate(35deg);
        opacity: 0;
    }
    10% { opacity: var(--opacity, .65); }
    90% { opacity: var(--opacity, .65); }
    100% {
        transform: translate3d(-118vw, 118vh, 0) rotate(35deg);
        opacity: 0;
    }
}

/* Header / logo */
header {
    position: sticky !important;
    top: 0;
    z-index: 20;
    background: rgba(6, 3, 12, .86) !important;
    border-bottom: 1px solid rgba(168, 91, 255, .22) !important;
    box-shadow: 0 8px 35px rgba(65, 19, 125, .16);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}

.logo,
.brand {
    display: flex !important;
    align-items: center;
    text-decoration: none;
}

.logo img,
.brand img {
    display: block;
    width: 170px;
    height: 58px;
    object-fit: contain;
    object-position: center;
    border-radius: 10px;
    filter:
        drop-shadow(0 0 8px rgba(161, 74, 255, .42))
        drop-shadow(0 0 20px rgba(110, 37, 210, .22));
    transition: transform .35s ease, filter .35s ease;
}

.logo img:hover,
.brand img:hover {
    transform: scale(1.035);
    filter:
        drop-shadow(0 0 10px rgba(190, 110, 255, .7))
        drop-shadow(0 0 28px rgba(110, 37, 210, .38));
}

/* Common links */
a {
    transition: color .25s ease, transform .25s ease, filter .25s ease;
}

.back,
.home {
    color: var(--ab-muted) !important;
}

.back:hover,
.home:hover {
    color: #fff !important;
    text-shadow: 0 0 12px rgba(192, 132, 252, .75);
    transform: translateX(3px);
}

/* Panels and cards */
.card,
.episode-card,
.anime,
.search,
.tag,
.episode-nav-btn,
.watchlist-button,
.watchlist,
.button {
    border-color: var(--ab-border) !important;
}

.card,
.episode-card {
    background:
        linear-gradient(145deg, rgba(28, 12, 47, .94), rgba(9, 5, 18, .94)) !important;
    box-shadow:
        0 12px 35px rgba(0, 0, 0, .28),
        inset 0 1px 0 rgba(255,255,255,.035);
    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        box-shadow .35s ease,
        border-color .35s ease;
}

.card:hover,
.episode-card:hover {
    transform: translateY(-5px);
    border-color: rgba(181, 105, 255, .58) !important;
    box-shadow:
        0 18px 48px rgba(0, 0, 0, .42),
        0 0 28px rgba(135, 49, 255, .14);
}

.search,
.tag,
.episode-nav-btn,
.watchlist-button,
.watchlist {
    background:
        linear-gradient(145deg, rgba(37, 16, 62, .92), rgba(18, 8, 31, .95)) !important;
    color: #fff !important;
}

.search:focus {
    outline: none;
    border-color: rgba(192, 132, 252, .85) !important;
    box-shadow: 0 0 0 3px rgba(155, 77, 255, .14), 0 0 25px rgba(155, 77, 255, .18);
}

.search::placeholder {
    color: #a894bf;
}

/* Purple buttons */
.button,
.watchlist,
.watchlist-button {
    background:
        linear-gradient(135deg, #7c2ce8, #a855f7 55%, #6d28d9) !important;
    box-shadow:
        0 8px 24px rgba(124, 44, 232, .28),
        inset 0 1px 0 rgba(255,255,255,.18);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
}

.button:hover,
.watchlist:hover,
.watchlist-button:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
    box-shadow:
        0 11px 30px rgba(145, 62, 255, .42),
        0 0 24px rgba(166, 87, 255, .2);
}

.episode-nav-btn:hover,
.remove:hover {
    background: linear-gradient(135deg, #35115b, #5b21b6) !important;
    border-color: rgba(192, 132, 252, .55) !important;
    box-shadow: 0 0 20px rgba(139, 63, 255, .18);
}

/* Typography */
h1, h2, h3, .anime-title, .episode-title, .section-title {
    text-shadow: 0 0 20px rgba(170, 89, 255, .08);
}

.description,
.synopsis,
.episode-summary p,
.loading,
.empty,
.hero p {
    color: var(--ab-muted) !important;
}

.genre {
    background: linear-gradient(135deg, #6d28d9, #a855f7) !important;
    box-shadow: 0 4px 14px rgba(124, 58, 237, .25);
}

/* Hero */
.hero {
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 80% 20%, rgba(156, 67, 255, .25), transparent 35%),
        radial-gradient(circle at 20% 70%, rgba(88, 28, 135, .17), transparent 35%),
        linear-gradient(to bottom, rgba(8, 3, 18, .18), rgba(5, 3, 11, .96)) !important;
}

.hero::after {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    right: -100px;
    top: -100px;
    border-radius: 50%;
    background: rgba(168, 85, 247, .14);
    filter: blur(65px);
    animation: abPulse 5s ease-in-out infinite;
    pointer-events: none;
}

@keyframes abPulse {
    0%,100% { transform: scale(.9); opacity: .55; }
    50% { transform: scale(1.12); opacity: .9; }
}

/* Posters */
.poster {
    box-shadow:
        0 15px 35px rgba(0,0,0,.42),
        0 0 25px rgba(134, 52, 230, .13);
    transition: transform .4s ease, box-shadow .4s ease;
}

.poster:hover {
    transform: translateY(-4px) scale(1.012);
    box-shadow:
        0 20px 45px rgba(0,0,0,.5),
        0 0 35px rgba(153, 69, 255, .22);
}

/* Ripple on interactive elements */
.ab-ripple {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(221, 190, 255, .55);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    animation: abRipple .6s ease-out forwards;
}

@keyframes abRipple {
    to {
        transform: translate(-50%, -50%) scale(18);
        opacity: 0;
    }
}

/* Smooth page entrance */
main, footer {
    animation: abPageIn .55s ease both;
}

@keyframes abPageIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Error state */
.error {
    background: rgba(70, 10, 35, .35) !important;
    border-color: rgba(244, 114, 182, .35) !important;
}

/* Mobile polish */
@media (max-width: 700px) {
    .logo img,
    .brand img {
        width: 145px;
        height: 55px;
    }

    header {
        padding-left: 12px !important;
        padding-right: 12px !important;
    }

    .card:hover,
    .episode-card:hover {
        transform: none;
    }

    .ab-star.streak {
        display: none;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}

</style>
</head>

<body>

<div class="ab-stars" aria-hidden="true"></div>


<header>
    <a class="logo brand" href="index.html" aria-label="Anumbrix home"><img src="assets/anumbrix-logo.png" alt="AnumBrix"></a>
</header>

<main class="container">

    <a href="index.html" class="back">← Back to ANUMBRIX</a>

    <div id="content">
        <p class="loading">Loading anime...</p>
    </div>

</main>

<script>

const params = new URLSearchParams(window.location.search);
const animeId = params.get("id");

const content = document.getElementById("content");

if (!animeId) {
    content.innerHTML = "<p>Anime not found.</p>";
} else {
    loadAnime(animeId);
}


async function loadAnime(id) {

    const query = `
    query ($id: Int) {

        Media(id: $id, type: ANIME) {

            id
idMal
            title {
                romaji
                english
                native
            }

            description(asHtml: false)

            coverImage {
                extraLarge
                large
            }

            bannerImage

            averageScore

            episodes

            duration

            status

            season

            seasonYear

            genres

            studios {
                nodes {
                    name
                }
            }

        }
    }
    `;

    try {

        const response = await fetch(
            "https://graphql.anilist.co",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    query: query,
                    variables: {
                        id: Number(id)
                    }
                })
            }
        );

        if (!response.ok) {
            throw new Error("AniList request failed");
        }

        const result = await response.json();

        const anime = result.data.Media;

        if (!anime) {
            content.innerHTML = "<p>Anime not found.</p>";
            return;
        }

        const title =
            anime.title.english ||
            anime.title.romaji ||
            anime.title.native;

        const description =
            anime.description ||
            "No description available.";

        const genres = anime.genres || [];

        const studios =
            anime.studios.nodes
                .map(studio => studio.name)
                .join(", ") || "Unknown";

        content.innerHTML = `

            <div class="anime">

                <div>
                    <img
                        class="poster"
                        src="${anime.coverImage.extraLarge || anime.coverImage.large}"
                        alt="${title}"
                    >
                </div>

                <div>

                    <h1>${title}</h1>

                    <div class="info">

                        <span class="tag">
                            ⭐ ${anime.averageScore || "N/A"}
                        </span>

                        <span class="tag">
                            📺 ${anime.episodes || "?"} episodes
                        </span>

                        <span class="tag">
                            ⏱️ ${anime.duration || "?"} min
                        </span>

                        <span class="tag">
                            📅 ${anime.seasonYear || "Unknown"}
                        </span>

<span class="tag">
    🎬 ${anime.season || "Unknown"}
</span>
                        <span class="tag">
                            ${anime.status || "Unknown"}
                        </span>

                    </div>

                    <p class="description">
                        ${description}
                    </p>

                    <strong>Genres</strong>

                    <div class="genres">

                        ${genres.map(genre => `
                            <span class="genre">
                                ${genre}
                            </span>
                        `).join("")}

                    </div>
<div class="episodes-section">

    <h2>📺 Episodes</h2>

    <div class="episodes">

        ${
            anime.episodes
            ? Array.from(
                { length: anime.episodes },
                (_, index) => `
    <div class="episode" onclick="openEpisode(${anime.id}, ${index + 1})">
        <span>Episode ${index + 1}</span>
    </div>
`
).join("")
            : "<p>No episode information available.</p>"
        }

    </div>

</div>
                    <p style="margin-top:20px;color:#aaaabd;">
                        <strong style="color:white;">Studio:</strong>
                        ${studios}
                    </p>

                    <button
                        class="watchlist"
                        onclick="addToWatchlist(${anime.id})"
                    >
                        ❤️ Add to Watchlist
                    </button>

                </div>

            </div>
        `;

        document.title = title + " — ANUMBRIX";

    } catch (error) {

        console.error(error);

        content.innerHTML =
            "<p>Unable to load anime details. Please try again.</p>";
    }
}


function addToWatchlist(id) {

    const title =
        document.querySelector("h1").textContent;

    const image =
        document.querySelector(".poster").src;

    const scoreElement =
        document.querySelector(".tag");

    const score =
        scoreElement
            ? scoreElement.textContent.replace("⭐", "").trim()
            : "N/A";

    let watchlist =
        JSON.parse(
            localStorage.getItem("anumbrix_watchlist") || "[]"
        );

    const alreadyAdded =
        watchlist.some(anime => anime.id === id);

    if (alreadyAdded) {

        alert("This anime is already in your watchlist!");

        return;
    }

    watchlist.push({
        id: id,
        title: title,
        image: image,
        score: score
    });

    localStorage.setItem(
        "anumbrix_watchlist",
        JSON.stringify(watchlist)
    );

    alert("❤️ Added to your watchlist!");
}
                function openEpisode(animeId, episodeNumber) {
    window.location.href =
        "watch.html?anime=" + animeId + "&episode=" + episodeNumber;
                }

</script>

<script>

/* =========================================================
   ANUMBRIX COSMIC UI EFFECTS
   ========================================================= */
(function () {
    function initAnumbrixEffects() {
        const starLayer = document.querySelector(".ab-stars");

        if (starLayer && !starLayer.dataset.ready) {
            starLayer.dataset.ready = "1";

            const starCount = window.innerWidth < 700 ? 38 : 62;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement("span");
                star.className = "ab-star";
                star.style.left = (Math.random() * 115 - 10) + "vw";
                star.style.top = (Math.random() * 115 - 10) + "vh";
                star.style.setProperty("--size", (Math.random() * 2.2 + 1) + "px");
                star.style.setProperty("--opacity", (Math.random() * .55 + .25).toFixed(2));
                star.style.setProperty("--duration", (Math.random() * 12 + 16).toFixed(1) + "s");
                star.style.setProperty("--delay", (-Math.random() * 22).toFixed(1) + "s");
                starLayer.appendChild(star);
            }

            for (let i = 0; i < 4; i++) {
                const streak = document.createElement("span");
                streak.className = "ab-star streak";
                streak.style.left = (Math.random() * 120 - 10) + "vw";
                streak.style.top = (Math.random() * 110 - 10) + "vh";
                streak.style.setProperty("--length", (Math.random() * 45 + 35) + "px");
                streak.style.setProperty("--duration", (Math.random() * 8 + 18).toFixed(1) + "s");
                streak.style.setProperty("--delay", (-Math.random() * 20).toFixed(1) + "s");
                streak.style.setProperty("--opacity", (Math.random() * .35 + .35).toFixed(2));
                starLayer.appendChild(streak);
            }
        }

        // Purple click ripple.
        document.addEventListener("click", function (event) {
            const target = event.target.closest("a, button, .card, .episode-nav-btn");
            if (!target) return;

            const rect = target.getBoundingClientRect();
            if (getComputedStyle(target).position === "static") {
                target.style.position = "relative";
            }
            target.style.overflow = "hidden";

            const ripple = document.createElement("span");
            ripple.className = "ab-ripple";
            ripple.style.left = (event.clientX - rect.left) + "px";
            ripple.style.top = (event.clientY - rect.top) + "px";
            target.appendChild(ripple);

            setTimeout(function () {
                ripple.remove();
            }, 650);
        }, { passive: true });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initAnumbrixEffects);
    } else {
        initAnumbrixEffects();
    }
})();

</script>
</body>
