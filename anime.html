<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Details — ANUMBRIX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: #11111a;
            border-bottom: 1px solid #242432;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #aaaabd;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        .anime {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 30px;
        }

        .poster {
            width: 100%;
            border-radius: 14px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .description {
            color: #aaaabd;
            line-height: 1.7;
            margin: 20px 0;
        }

        .info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .tag {
            background: #1b1b27;
            border: 1px solid #303040;
            padding: 8px 12px;
            border-radius: 8px;
            color: #ddd;
        }

        .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .genre {
            background: #7c4dff;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 13px;
        }

        .watchlist {
            margin-top: 25px;
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #7c4dff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .watchlist:hover {
            opacity: 0.9;
        }

        .loading {
            color: #aaaabd;
        }

        @media (max-width: 700px) {
            .anime {
                grid-template-columns: 1fr;
            }

            .poster {
                max-width: 250px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ANUMBRIX</div>
</header>

<main class="container">

    <a href="index.html" class="back">← Back to ANUMBRIX</a>

    <div id="content">
        <p class="loading">Loading anime...</p>
    </div>

</main>

<script>

const params = new URLSearchParams(window.location.search);
const animeId = params.get("id");

const content = document.getElementById("content");

if (!animeId) {

    content.innerHTML = "<p>Anime not found.</p>";

} else {

    loadAnime(animeId);
}


async function loadAnime(id) {

    const query = `
    query ($id: Int) {

        Media(id: $id, type: ANIME) {

            id

            title {
                romaji
                english
                native
            }

            description(asHtml: false)

            coverImage {
                extraLarge
                large
            }

            bannerImage

            averageScore

            episodes

            duration

            status

            season

            seasonYear

            genres

            studios {
                nodes {
                    name
                }
            }

        }
    }
    `;

    try {

        const response = await fetch(
            "https://graphql.anilist.co",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    query: query,
                    variables: {
                        id: Number(id)
                    }
                })
            }
        );

        if (!response.ok) {
            throw new Error("AniList request failed");
        }

        const result = await response.json();

        const anime = result.data.Media;

        if (!anime) {
            content.innerHTML = "<p>Anime not found.</p>";
            return;
        }

        const title =
            anime.title.english ||
            anime.title.romaji ||
            anime.title.native;

        const description =
            anime.description ||
            "No description available.";

        const genres = anime.genres || [];

        const studios =
            anime.studios.nodes
                .map(studio => studio.name)
                .join(", ") || "Unknown";

        content.innerHTML = `

            <div class="anime">

                <div>
                    <img
                        class="poster"
                        src="${anime.coverImage.extraLarge || anime.coverImage.large}"
                        alt="${title}"
                    >
                </div>

                <div>

                    <h1>${title}</h1>

                    <div class="info">

                        <span class="tag">
                            ⭐ ${anime.averageScore || "N/A"}
                        </span>

                        <span class="tag">
                            📺 ${anime.episodes || "?"} episodes
                        </span>

                        <span class="tag">
                            ⏱️ ${anime.duration || "?"} min
                        </span>

                        <span class="tag">
                            📅 ${anime.seasonYear || "Unknown"}
                        </span>

                        <span class="tag">
                            ${anime.status || "Unknown"}
                        </span>

                    </div>

                    <p class="description">
                        ${description}
                    </p>

                    <strong>Genres</strong>

                    <div class="genres">

                        ${genres.map(genre => `
                            <span class="genre">
                                ${genre}
                            </span>
                        `).join("")}

                    </div>

                    <p style="margin-top:20px;color:#aaaabd;">
                        <strong style="color:white;">Studio:</strong>
                        ${studios}
                    </p>

                    <button
                        class="watchlist"
                        onclick="addToWatchlist(${anime.id})"
                    >
                        ❤️ Add to Watchlist
                    </button>

                </div>

            </div>
        `;

        document.title = title + " — ANUMBRIX";

    } catch (error) {

        console.error(error);

        content.innerHTML =
            "<p>Unable to load anime details. Please try again.</p>";
    }
}


function addToWatchlist(id) {

    const title =
        document.querySelector("h1").textContent;

    const image =
        document.querySelector(".poster").src;

    const scoreElement =
        document.querySelector(".tag");

    const score =
        scoreElement
            ? scoreElement.textContent.replace("⭐", "").trim()
            : "N/A";

    let watchlist =
        JSON.parse(
            localStorage.getItem("anumbrix_watchlist") || "[]"
        );

    const alreadyAdded =
        watchlist.some(anime => anime.id === id);

    if (alreadyAdded) {

        alert("This anime is already in your watchlist!");

        return;
    }

    watchlist.push({
        id: id,
        title: title,
        image: image,
        score: score
    });

    localStorage.setItem(
        "anumbrix_watchlist",
        JSON.stringify(watchlist)
    );

    alert("❤️ Added to your watchlist!");
}

</script>

</body>
</html>
