<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Episode — ANUMBRIX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: #11111a;
            border-bottom: 1px solid #242432;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #aaaabd;
            text-decoration: none;
            font-size: 17px;
        }

        .back:hover {
            color: white;
        }

        .episode-card {
            background: #11111a;
            border: 1px solid #292938;
            border-radius: 14px;
            padding: 25px;
        }

        .anime-header {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
        }

        .poster {
            width: 180px;
            border-radius: 12px;
        }

        .anime-title {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .episode-number {
            color: #aaaabd;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .episode-title {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .japanese-title {
            color: #aaaabd;
            margin-bottom: 20px;
        }

        .info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .tag {
            background: #1b1b27;
            border: 1px solid #303040;
            padding: 8px 12px;
            border-radius: 8px;
            color: #ddd;
        }

        .section-title {
            font-size: 20px;
            margin-top: 25px;
            margin-bottom: 12px;
        }

        .synopsis {
            color: #aaaabd;
            line-height: 1.7;
            font-size: 16px;
        }

        .episode-summary {
            margin: 25px 0;
        }

        .episode-summary h3 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .episode-summary p {
            color: #aaaabd;
            line-height: 1.7;
            font-size: 16px;
        }


        .loading {
            color: #aaaabd;
            font-size: 18px;
        }

        .error {
            color: #ff7777;
            background: #241414;
            border: 1px solid #552222;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.6;
        }


        .episode-navigation {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 30px;
        }

        .episode-nav-btn {
            flex: 1;
            display: inline-block;
            padding: 12px 16px;
            border-radius: 9px;
            border: 1px solid #303040;
            background: #1b1b27;
            color: white;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
        }

        .episode-nav-btn:hover {
            background: #292938;
        }

        .episode-nav-btn.disabled {
            opacity: .4;
            pointer-events: none;
        }

        .watchlist-button {
            margin-top: 15px;
            padding: 10px 14px;
            border: 1px solid #303040;
            border-radius: 8px;
            background: #1b1b27;
            color: white;
            cursor: pointer;
        }

        .watchlist-button:hover {
            background: #292938;
        }

        .anime-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .search-tools {
            margin: 25px 0;
        }

        @media (max-width: 700px) {

            .anime-header {
                flex-direction: column;
            }

            .poster {
                width: 180px;
            }

            .anime-title {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ANUMBRIX</div>
</header>

<main class="container">

    <a href="javascript:history.back()" class="back">
        ← Back
    </a>

    <div id="content">
        <p class="loading">Loading episode information...</p>
    </div>

</main>


<script>

const params = new URLSearchParams(window.location.search);

const animeId = params.get("anime");
const episodeNumber = params.get("episode");

const content = document.getElementById("content");


if (!animeId || !episodeNumber) {

    content.innerHTML = `
        <div class="error">
            Missing anime or episode information.
        </div>
    `;

} else {

    loadEpisode();

}


async function loadEpisode() {

    try {

        /*
         * STEP 1
         * Get anime information from AniList.
         */

        const animeQuery = `
        query ($id: Int) {

            Media(id: $id, type: ANIME) {

                id

                idMal

                title {
                    romaji
                    english
                    native
                }

                coverImage {
                    extraLarge
                    large
                }

                episodes

            }

        }
        `;


        const animeResponse = await fetch(
            "https://graphql.anilist.co",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    query: animeQuery,
                    variables: {
                        id: Number(animeId)
                    }
                })
            }
        );


        if (!animeResponse.ok) {
            throw new Error("AniList request failed.");
        }


        const animeResult = await animeResponse.json();

        const anime = animeResult.data.Media;


        if (!anime) {
            throw new Error("Anime was not found.");
        }


        const title =
            anime.title.english ||
            anime.title.romaji ||
            anime.title.native ||
            "Unknown Anime";


        /*
         * STEP 2
         * Get the individual episode from Jikan.
         */

        


        let episode = null;

        /*
         * STEP 2
         * Get the individual episode from Jikan.
         *
         * Jikan can temporarily return 429/5xx errors, so use
         * a small retry system and fall back to the episode-list
         * endpoint if the direct episode endpoint fails.
         */

        async function fetchWithRetry(url, options = {}, attempts = 3) {
            let lastError = null;

            for (let attempt = 1; attempt <= attempts; attempt++) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                try {
                    const response = await fetch(url, {
                        ...options,
                        signal: controller.signal
                    });

                    clearTimeout(timeout);

                    if (response.ok) {
                        return response;
                    }

                    lastError = new Error(
                        `Jikan returned HTTP ${response.status}`
                    );

                    // Rate-limit/server errors: wait before retrying.
                    if (
                        response.status === 429 ||
                        response.status >= 500
                    ) {
                        await new Promise(resolve =>
                            setTimeout(resolve, 1500 * attempt)
                        );
                        continue;
                    }

                    return null;

                } catch (error) {
                    clearTimeout(timeout);
                    lastError = error;

                    if (attempt < attempts) {
                        await new Promise(resolve =>
                            setTimeout(resolve, 1000 * attempt)
                        );
                    }
                }
            }

            console.error("Jikan request failed:", lastError);
            return null;
        }

        if (anime.idMal) {

            // First try the exact episode endpoint.
            const episodeURL =
                "https://api.jikan.moe/v4/anime/" +
                anime.idMal +
                "/episodes/" +
                episodeNumber;

            try {
                const episodeResponse =
                    await fetchWithRetry(episodeURL);

                if (episodeResponse) {
                    const episodeResult =
                        await episodeResponse.json();

                    if (episodeResult.data) {
                        episode = episodeResult.data;
                    }
                }
            } catch (error) {
                console.error(
                    "Direct episode request failed:",
                    error
                );
            }

            /*
             * If the direct endpoint did not work, try the paginated
             * episode list. This also helps when Jikan rate-limits
             * one of the endpoints temporarily.
             */
            if (!episode) {

                try {

                    let page = 1;

                    while (!episode && page <= 10) {

                        const listURL =
                            "https://api.jikan.moe/v4/anime/" +
                            anime.idMal +
                            "/episodes?page=" +
                            page;

                        const listResponse =
                            await fetchWithRetry(listURL);

                        if (!listResponse) {
                            break;
                        }

                        const listResult =
                            await listResponse.json();

                        if (Array.isArray(listResult.data)) {

                            episode =
                                listResult.data.find(
                                    ep =>
                                        Number(ep.mal_id) ===
                                        Number(episodeNumber)
                                );
                        }

                        if (
                            episode ||
                            !listResult.pagination ||
                            !listResult.pagination.has_next_page
                        ) {
                            break;
                        }

                        page++;

                        // Respect Jikan's rate limit.
                        await new Promise(resolve =>
                            setTimeout(resolve, 600)
                        );
                    }

                } catch (error) {
                    console.error(
                        "Episode-list request failed:",
                        error
                    );
                }
            }
        }

        /*
         * If Jikan doesn't have this episode,
         * show a graceful fallback.
         */
        if (!episode) {
            episode = {
                mal_id: null,
                title: `Episode ${episodeNumber}`,
                title_japanese: null,
                title_romanji: null,
                aired: null,
                score: null,
                filler: false,
                recap: false,
                synopsis: null,
                url: null
            };
        }

        /*
         * STEP 3
         * Display everything.
         */

        const poster =
            anime.coverImage.extraLarge ||
            anime.coverImage.large ||
            "";


        content.innerHTML = `

            <div class="episode-card">

                <div class="anime-header">

                    <img
                        class="poster"
                        src="${poster}"
                        alt="${title}"
                    >

                    <div>

                        <h1 class="anime-title">
                            ${title}
                        </h1>

                        <p class="episode-number">
                            Episode ${episodeNumber}
                        </p>
                        <div class="anime-meta">
                            ${
                                anime.episodes
                                    ? `<span class="tag">📺 ${anime.episodes} Episodes</span>`
                                    : ""
                            }
                        </div>

                        <button
                            class="watchlist-button"
                            id="watchlistButton"
                            type="button"
                        >
                            ❤️ Add to Watchlist
                        </button>


                        <h2 class="episode-title">
                            ${episode.title || "Episode " + episodeNumber}
                        </h2>

                        ${
                            episode.title_japanese
                            ? `
                                <p class="japanese-title">
                                    ${episode.title_japanese}
                                </p>
                            `
                            : ""
                        }

                    </div>

                </div>
${episode.synopsis
    ? `
        <div class="episode-summary">
            <h3>Summary</h3>
            <p>${episode.synopsis}</p>
        </div>
      `
    : `
        <div class="episode-summary">
            <h3>Summary</h3>
            <p>Episode summary is not available.</p>
        </div>
      `
}

                <div class="info">

                    ${
                        episode.aired
                        ? `
                            <span class="tag">
                                📅 ${formatDate(episode.aired)}
                            </span>
                        `
                        : ""
                    }


                    ${
                        episode.score
                        ? `
                            <span class="tag">
                                ⭐ ${episode.score}
                            </span>
                        `
                        : ""
                    }


                    ${
                        episode.filler
                        ? `
                            <span class="tag">
                                🔶 Filler
                            </span>
                        `
                        : ""
                    }


                    ${
                        episode.recap
                        ? `
                            <span class="tag">
                                🔁 Recap
                            </span>
                        `
                        : ""
                    }

                </div>


                ${
                    episode.synopsis
                    ? `
                        <h3 class="section-title">
                            Episode Synopsis
                        </h3>

                        <p class="synopsis">
                            ${episode.synopsis}
                        </p>
                    `
                    : `
                        <h3 class="section-title">
                            Episode Synopsis
                        </h3>

                        <p class="synopsis">
                            No synopsis available for this episode.
                        </p>
                    `
                }

                <div class="episode-navigation">
                    ${
                        Number(episodeNumber) > 1
                        ? `
                            <a
                                class="episode-nav-btn"
                                href="watch.html?anime=${animeId}&episode=${Number(episodeNumber) - 1}"
                            >
                                ← Previous Episode
                            </a>
                        `
                        : `
                            <span class="episode-nav-btn disabled">
                                ← Previous Episode
                            </span>
                        `
                    }

                    ${
                        anime.episodes &&
                        Number(episodeNumber) < Number(anime.episodes)
                        ? `
                            <a
                                class="episode-nav-btn"
                                href="watch.html?anime=${animeId}&episode=${Number(episodeNumber) + 1}"
                            >
                                Next Episode →
                            </a>
                        `
                        : `
                            <span class="episode-nav-btn disabled">
                                Next Episode →
                            </span>
                        `
                    }
                </div>

            </div>

        `;


        document.title =
            title +
            " - Episode " +
            episodeNumber +
            " — ANUMBRIX";

        // Connect the Add/Remove Watchlist button after it is rendered.
        updateWatchlistButton(anime, title, poster);


    } catch (error) {

        console.error(error);

        content.innerHTML = `

            <div class="error">

                <strong>
                    Unable to load episode information.
                </strong>

                <br><br>

                ${error.message}

            </div>

        `;

    }

}



        /*
         * Watchlist helper
         * Uses the same localStorage key as watchlist.html.
         */
        function updateWatchlistButton(anime, title, poster) {
            const button =
                document.getElementById("watchlistButton");

            if (!button) return;

            let watchlist = [];

            try {
                watchlist = JSON.parse(
                    localStorage.getItem("anumbrix_watchlist") || "[]"
                );
            } catch (error) {
                watchlist = [];
            }

            const alreadyAdded =
                watchlist.some(
                    item => Number(item.id) === Number(animeId)
                );

            button.textContent =
                alreadyAdded
                    ? "✓ Added to Watchlist"
                    : "❤️ Add to Watchlist";

            button.onclick = function () {
                let current = [];

                try {
                    current = JSON.parse(
                        localStorage.getItem("anumbrix_watchlist") || "[]"
                    );
                } catch (error) {
                    current = [];
                }

                const index =
                    current.findIndex(
                        item => Number(item.id) === Number(animeId)
                    );

                if (index >= 0) {
                    current.splice(index, 1);
                } else {
                    current.push({
                        id: Number(animeId),
                        title: title,
                        image: poster,
                        score: anime.averageScore || null
                    });
                }

                localStorage.setItem(
                    "anumbrix_watchlist",
                    JSON.stringify(current)
                );

                updateWatchlistButton(anime, title, poster);
            };
        }

function formatDate(dateString) {

    if (!dateString) {
        return "Unknown";
    }

    const date =
        new Date(dateString);

    if (isNaN(date)) {
        return dateString;
    }

    return date.toLocaleDateString(
        undefined,
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


/*
 * Fallback if AniList does not have
 * a MyAnimeList ID.
 */

function showAnimeOnly(anime, title) {

    const poster =
        anime.coverImage.extraLarge ||
        anime.coverImage.large ||
        "";


    content.innerHTML = `

        <div class="episode-card">

            <div class="anime-header">

                <img
                    class="poster"
                    src="${poster}"
                    alt="${title}"
                >

                <div>

                    <h1 class="anime-title">
                        ${title}
                    </h1>

                    <p class="episode-number">
                        Episode ${episodeNumber}
                    </p>

                </div>

            </div>


            <h3 class="section-title">
                Episode Information
            </h3>

            <p class="synopsis">
                Detailed information for this episode
                is not available from the current data source.
            </p>

        </div>

    `;

}

</script>

</body>
</html>
