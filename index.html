<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnumBrix — Discover Anime</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#06030b;--bg2:#10051c;--purple:#8b2cff;--purple2:#c16cff;
 --lav:#ead8ff;--text:#fff;--muted:#bca9cb;
 --card:rgba(18,6,32,.82);--border:rgba(177,80,255,.34);
}
html{scroll-behavior:smooth}
body{
 font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;
 background:
 radial-gradient(circle at 85% 8%,rgba(139,44,255,.25),transparent 27%),
 radial-gradient(circle at 10% 45%,rgba(104,0,255,.13),transparent 30%),
 linear-gradient(135deg,#040207,#10051c 52%,#050207);
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:radial-gradient(circle at 50% 110%,rgba(139,44,255,.13),transparent 38%);
}

/* 7 small glowing stars: no streaks */
.star-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.star{
 position:absolute;width:var(--size);height:var(--size);left:calc(100% + 15px);top:var(--top);
 border-radius:50%;background:#fff;opacity:0;
 box-shadow:0 0 5px #fff,0 0 12px #d39aff,0 0 22px #8b2cff;
 animation:fall var(--duration) linear var(--delay) infinite;
}
.star:before,.star:after{
 content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 background:#fff;border-radius:50%;
}
.star:before{width:1px;height:10px;box-shadow:0 0 7px #fff}
.star:after{width:10px;height:1px;box-shadow:0 0 7px #d39aff}
@keyframes fall{
 0%{transform:translate(0,-8vh) scale(.75);opacity:0}
 8%{opacity:.95}
 88%{opacity:.85}
 100%{transform:translate(-120vw,118vh) scale(1);opacity:0}
}

header{
 position:sticky;top:0;z-index:20;min-height:82px;padding:10px 5%;
 display:flex;align-items:center;justify-content:space-between;gap:18px;
 background:rgba(6,3,11,.82);backdrop-filter:blur(18px);
 border-bottom:1px solid rgba(180,85,255,.25);
 box-shadow:0 5px 35px rgba(100,0,255,.1);
}
.logo{width:155px;max-height:62px;object-fit:contain;filter:drop-shadow(0 0 9px rgba(155,60,255,.7)) drop-shadow(0 0 25px rgba(110,20,255,.35));transition:.3s}
.logo:hover{transform:scale(1.05)}
.header-right{display:flex;align-items:center;gap:12px}
.watchlist-btn{
 text-decoration:none;color:#fff;background:rgba(35,13,53,.92);
 border:1px solid rgba(190,95,255,.35);padding:13px 18px;border-radius:15px;
 font-weight:bold;transition:.3s;box-shadow:0 0 20px rgba(139,44,255,.08)
}
.watchlist-btn:hover{transform:translateY(-2px);border-color:#c16cff;box-shadow:0 0 28px rgba(150,40,255,.35)}
.search-box{
 width:255px;height:52px;border-radius:15px;border:1px solid rgba(188,83,255,.42);
 background:rgba(39,13,61,.82);color:#fff;outline:none;padding:0 18px;font-size:16px;
 box-shadow:inset 0 0 20px rgba(125,30,255,.08);transition:.3s
}
.search-box:focus{border-color:#c16cff;box-shadow:0 0 0 3px rgba(168,69,255,.1),0 0 25px rgba(139,44,255,.28)}
.search-box::placeholder{color:#aa8ebd}

main{position:relative;z-index:2}
.hero{min-height:500px;padding:82px 5% 70px;display:flex;align-items:center;position:relative;overflow:hidden}
.hero:after{
 content:"";position:absolute;width:600px;height:600px;right:-220px;top:-180px;
 background:radial-gradient(circle,rgba(158,53,255,.28),transparent 67%);pointer-events:none
}
.hero-content{max-width:780px}
.hero h1{
 font-size:clamp(45px,8vw,82px);line-height:.98;letter-spacing:-3px;margin-bottom:26px;
 background:linear-gradient(100deg,#fff,#e6caff 45%,#a842ff);
 -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:#c5b3d3;font-size:20px;line-height:1.65;max-width:700px;margin-bottom:32px}
.explore-btn{
 display:inline-block;text-decoration:none;color:#fff;font-size:18px;font-weight:bold;padding:17px 28px;
 border-radius:16px;background:linear-gradient(135deg,#a52fff,#6f18d9);
 border:1px solid rgba(222,173,255,.4);box-shadow:0 0 25px rgba(143,38,255,.35);transition:.3s
}
.explore-btn:hover{transform:translateY(-4px);box-shadow:0 0 35px rgba(160,50,255,.6)}

.section{padding:30px 5% 80px}
.section-title{font-size:34px;margin-bottom:28px}
.section-title span{filter:drop-shadow(0 0 8px rgba(255,130,20,.35))}
.anime-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.anime-card{
 position:relative;overflow:hidden;min-height:440px;border-radius:20px;background:var(--card);
 border:1px solid var(--border);box-shadow:0 10px 35px rgba(0,0,0,.3),inset 0 0 30px rgba(120,25,220,.05);
 cursor:pointer;transition:transform .4s,border-color .4s,box-shadow .4s;
 animation:cardIn .65s ease both;text-decoration:none;color:#fff
}
.anime-card:hover{transform:translateY(-9px);border-color:rgba(202,115,255,.8);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 35px rgba(142,41,255,.22)}
.anime-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.anime-card:hover .anime-poster{transform:scale(1.06)}
.poster-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,2,14,.98) 3%,rgba(7,2,14,.74) 38%,rgba(7,2,14,.05) 76%)}
.anime-info{position:absolute;z-index:2;left:20px;right:20px;bottom:19px}
.anime-title{font-size:20px;line-height:1.25;margin-bottom:10px;text-shadow:0 2px 12px #000}
.anime-meta{color:#ded0e7;font-size:14px}.rating{color:#ffd83d;font-weight:bold}
.loading-card{display:flex;align-items:center;justify-content:center;color:#bca9cb;font-size:15px}
.no-results{text-align:center;padding:70px 20px;color:#a994b8;display:none}
.no-results h2{color:#fff;margin-bottom:10px}
.status{color:#a994b8;margin:-12px 0 22px;font-size:14px;min-height:18px}
footer{position:relative;z-index:2;text-align:center;padding:35px 20px;color:#8f7b9f;border-top:1px solid rgba(170,70,255,.15)}
@keyframes cardIn{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:1000px){.anime-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){
 header{min-height:78px;padding:9px 16px;gap:10px}.logo{width:105px}
 .header-right{flex:1;justify-content:flex-end;gap:7px}.watchlist-btn{padding:11px 12px;font-size:13px}
 .search-box{width:min(160px,42vw);height:45px;font-size:14px;padding:0 12px}
 .hero{min-height:430px;padding:60px 25px}.hero h1{font-size:50px;letter-spacing:-2px}.hero p{font-size:17px}
 .section{padding-left:20px;padding-right:20px}.section-title{font-size:29px}
 .anime-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
 .anime-card{min-height:360px;border-radius:17px}.anime-info{left:14px;right:14px;bottom:14px}.anime-title{font-size:16px}.anime-meta{font-size:12px}
}
@media(max-width:420px){
 .logo{width:92px}.watchlist-btn{font-size:12px;padding:10px 9px}.search-box{width:38vw}
 .anime-card{min-height:330px}.anime-title{font-size:15px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="star-field" id="starField" aria-hidden="true"></div>

<header>
 <a href="index.html" aria-label="AnumBrix home">
  <img class="logo" src="assets/anumbrix-logo.png" alt="AnumBrix">
 </a>
 <div class="header-right">
  <a class="watchlist-btn" href="watchlist.html">❤️ Watchlist</a>
  <input id="searchInput" class="search-box" type="search" placeholder="Search anime..." autocomplete="off">
 </div>
</header>

<main>
<section class="hero">
 <div class="hero-content">
  <h1>Discover Your Next Anime.</h1>
  <p>Explore anime, track what you watch, discover new favorites and find legitimate ways to watch.</p>
  <a class="explore-btn" href="#trending">Explore Anime</a>
 </div>
</section>

<section class="section" id="trending">
 <h2 class="section-title"><span>🔥</span> <span style="filter:none">Trending</span></h2>
 <div class="status" id="status"></div>
 <div class="anime-grid" id="animeGrid" aria-live="polite"></div>
 <div class="no-results" id="noResults">
  <h2>Anime not found</h2><p>Try searching for another anime.</p>
 </div>
</section>
</main>

<footer><p>© 2026 AnumBrix · Discover your next anime 💜</p></footer>

<script>
/* =========================
   FALLING STARS — exactly 7
   Small glowing stars, no streak trails.
========================= */
const starField=document.getElementById("starField");
for(let i=0;i<7;i++){
 const star=document.createElement("div");
 star.className="star";
 star.style.setProperty("--size",(Math.random()*3+2)+"px");
 star.style.setProperty("--top",(Math.random()*25-10)+"vh");
 star.style.setProperty("--duration",(13+Math.random()*8)+"s");
 star.style.setProperty("--delay",(-Math.random()*18)+"s");
 starField.appendChild(star);
}

/* =========================
   ANILIST DATA
   Every card uses an AniList ID.
   anime.html expects ?id=...
========================= */
const TRENDING_IDS=[20,176496,101922,21,113415,16498,151807,154587];
const grid=document.getElementById("animeGrid");
const searchInput=document.getElementById("searchInput");
const noResults=document.getElementById("noResults");
const statusEl=document.getElementById("status");

const QUERY=`
query($ids:[Int]){
 Page(perPage:50){
  media(id_in:$ids,type:ANIME){
   id
   title{romaji english native}
   coverImage{extraLarge large}
   averageScore
   episodes
  }
 }
}`;

const SEARCH_QUERY=`
query($search:String){
 Page(page:1,perPage:24){
  media(search:$search,type:ANIME,sort:POPULARITY_DESC){
   id
   title{romaji english native}
   coverImage{extraLarge large}
   averageScore
   episodes
  }
 }
}`;

function displayTitle(media){
 return media.title.english || media.title.romaji || media.title.native || "Unknown Anime";
}
function makeCard(media,index=0){
 const title=displayTitle(media);
 const score=media.averageScore ? (media.averageScore/10).toFixed(1) : "—";
 const episodes=media.episodes ?? "—";
 const poster=media.coverImage?.extraLarge || media.coverImage?.large || "";
 const card=document.createElement("a");
 card.className="anime-card";
 card.href="anime.html?id="+encodeURIComponent(media.id);
 card.dataset.title=(title+" "+(media.title.romaji||"")+" "+(media.title.native||"")).toLowerCase();
 card.style.animationDelay=Math.min(index*45,700)+"ms";
 card.innerHTML=`
  <img class="anime-poster" src="${poster}" alt="${escapeHtml(title)} poster" loading="${index<4?"eager":"lazy"}">
  <div class="poster-overlay"></div>
  <div class="anime-info">
   <h3 class="anime-title">${escapeHtml(title)}</h3>
   <div class="anime-meta"><span class="rating">⭐ ${score}</span> · ${episodes} episodes</div>
  </div>`;
 card.addEventListener("click",()=>{card.style.transform="scale(.97)";setTimeout(()=>card.style.transform="",120)});
 return card;
}
function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function render(list){
 grid.innerHTML="";
 noResults.style.display=list.length?"none":"block";
 list.forEach((media,i)=>grid.appendChild(makeCard(media,i)));
}
async function anilistRequest(query,variables){
 const response=await fetch("https://graphql.anilist.co",{
  method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({query,variables})
 });
 if(!response.ok) throw new Error("AniList request failed ("+response.status+").");
 const json=await response.json();
 if(json.errors?.length) throw new Error(json.errors[0].message||"AniList error.");
 return json.data;
}

async function loadTrending(){
 statusEl.textContent="Loading anime...";
 try{
  const data=await anilistRequest(QUERY,{ids:TRENDING_IDS});
  const media=data.Page.media.sort((a,b)=>TRENDING_IDS.indexOf(a.id)-TRENDING_IDS.indexOf(b.id));
  render(media);
  statusEl.textContent="";
 }catch(error){
  console.error(error);
  statusEl.textContent="Could not load anime right now. Please refresh the page.";
  render([]);
 }
}
let searchTimer=null;
searchInput.addEventListener("input",()=>{
 clearTimeout(searchTimer);
 const q=searchInput.value.trim();
 if(!q){loadTrending();return}
 statusEl.textContent="Searching AniList...";
 searchTimer=setTimeout(async()=>{
  try{
   const data=await anilistRequest(SEARCH_QUERY,{search:q});
   render(data.Page.media);
   statusEl.textContent=data.Page.media.length?"":"No matches found.";
  }catch(error){
   console.error(error);
   statusEl.textContent="Search is temporarily unavailable. Try again.";
   render([]);
  }
 },350);
});

loadTrending();
</script>
</body>
</html>
